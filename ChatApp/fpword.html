<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Alumnus | Forgot Password</title>
    <link rel="icon" href="./res/logo.jpg">
    <link rel="stylesheet" href="./css/signin.css">
</head>
<body>
    <section>
        <div class="logo">
            <img src="./res/logo.jpg" height="200" alt="Courier Logo">
        </div>
        <div class="card">
            <form action="index.html" method="post">
                <h1>Forgot Password</h1><br>
                <label for="cphone">Enter Phone Number:</label>
                <input type="tel" id="cphone" placeholder="Enter Phone Number" required><br>
                <label for="vcode">Enter Code Sent to this number:</label>
                <input type="tel" id="vcode" placeholder="Enter Verification Code"><br>
                <label for="pword">New Password:</label>
                <input type="password" id="pword" placeholder="Enter New Password"><br>
                <label for="cpword">Confirm Password:</label>
                <input type="password" id="cpword" placeholder="Confirm Password"><br>
                <input type="submit" value="SignIn"><br>
                <h5><a href="./signup.html">Create New Account</a></h5>
            </form>
        </div>
    </section>
</body>
</html>
