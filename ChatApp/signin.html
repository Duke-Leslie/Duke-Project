<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Alumnus | Signin</title>
    <link rel="icon" href="./res/logo.jpg">
    <link rel="stylesheet" href="./css/signin.css">
</head>
<body>
    <section>
        <div class="logo">
            <img src="./res/logo.jpg" height="200" alt="Courier Logo">
        </div>
        <div class="card">
            <form action="index.html" method="post">
                <h1>SignIn</h1><br>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter Name" required><br>
                <label for="pword">Password:</label>
                <input type="password" id="pword" placeholder="Enter Password" required><br>
                <input type="submit" value="SignIn"><br>
                <h5><a href="./signup.html">Create New Account</a> Or <a href="fpword.html">Forgot Password</a></h5>
            </form>
        </div>
    </section>
</body>
</html>
